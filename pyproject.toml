[project]
name = "mood-steering"
version = "0.0.0"
description = "Démonstrateur d'expression d'humeur d'un SLM par steering d'activations, comparé à un prompt de jeu de rôle."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "gguf>=0.19.0",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
llama = [
    "llama-cpp-python>=0.3.36",
]
eval = [
    "anthropic>=2.5.0",
    "huggingface-hub>=0.36.2",
    "protobuf>=7.36.2",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "sentencepiece>=0.2.2",
    "torch>=2.15.0",
    "transformers<5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mood_steering"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Outillage tiers vendu dans le dépôt (skills BMAD, kit de coûts) : hors du périmètre du lint.
extend-exclude = [".claude", "_bmad", "_bmad-output"]

[[tool.uv.index]]
name = "llama-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
